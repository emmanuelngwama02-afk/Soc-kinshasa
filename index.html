<title>SOC KINSHASA - Emmanuel Ngwama</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#070B09;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(135deg,#00E676 0%,#00C853 45%,#00B0FF 100%);padding:28px 18px 22px;text-align:center;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.topbar:before{content:'';position:absolute;inset:0;background:radial-gradient(300px 120px at 20% 0%,rgba(255,255,255,.35),transparent 60%)}
.topbar h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.5px;color:#02120A;position:relative}
.topbar h1 span{font-size:32px}
.topbar .subtitle{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#02331A;margin-top:4px;position:relative}
.topbar .owner{margin:14px auto 0;background:rgba(255,255,255,.92);width:fit-content;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#111;display:flex;gap:8px;align-items:center;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.topbar .owner i{width:26px;height:26px;background:#00C853;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.contact{background:#101713;margin:16px 16px 0;border:1px solid #1F2A24;border-radius:20px;padding:16px;text-align:center}
.contact small{color:#9AA8A0;font-size:12px;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.contact b{display:block;font-size:17px;margin:6px 0 2px}
.contact p{color:#C7D2CC;font-size:13px}
.contact a{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;background:#25D366;color:#04120A;font-weight:800;padding:13px;border-radius:14px;text-decoration:none;font-size:15px}
.contact a span{font-size:18px}
.stats{display:flex;gap:12px;margin:16px}
.stat{flex:1;background:linear-gradient(180deg,#161F1B,#0F1512);border:1px solid #222E27;border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font-size:22px;font-family:'Plus Jakarta Sans',sans-serif}
.stat span{font-size:12px;color:#8FA094;font-weight:500}
.card{background:#fff;color:#111;border-radius:26px;padding:22px 18px;margin:0 16px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.card .badge{display:inline-block;background:#E6FFF0;color:#00A651;font-size:11px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:999px;text-transform:uppercase}
.card h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;line-height:1.15;letter-spacing:-.6px;margin:12px 0 6px}
.card h2 em{font-style:normal;color:#00A651}
.card p{color:#5B6B62;font-size:14px;line-height:1.5}
.input-wrap{margin-top:16px;background:#F2F5F3;border:1px solid #E3EAE5;border-radius:16px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px}
.input-wrap span{font-size:18px}
input{flex:1;border:none;background:transparent;outline:none;font-size:15px;font-weight:500;color:#111;padding:12px 0}
input::placeholder{color:#9AA8A0}
button{width:100%;margin-top:12px;padding:15px;background:#111;color:white;border:none;border-radius:14px;font-size:16px;font-weight:800;letter-spacing:.2px;cursor:pointer}
button:active{transform:scale(.98)}
#protect-bar{width:100%;height:34px;background:#F0F3F1;border-radius:999px;overflow:hidden;margin:16px 0 0;display:none;border:1px solid #E3EAE5}
#protect-fill{height:100%;width:0%;background:#00C853;color:white;font-weight:800;line-height:34px;font-size:13px;transition:width .6s;text-align:center}
#protect-raisons{background:#0F1512;color:white;padding:14px;border-radius:14px;margin-top:12px;text-align:left;display:none;font-size:14px;line-height:1.7}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px}
.feat{background:#141B17;border:1px solid #222E27;border-radius:18px;padding:14px}
.feat b{font-size:22px}
.feat h4{font-size:13px;margin:6px 0 4px}
.feat p{font-size:12px;color:#8FA094;line-height:1.5}
